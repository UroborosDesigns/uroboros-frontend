name: Keep Backend Alive

on:
  schedule:
    # Render's free tier spins the backend down after ~15 min of no HTTP
    # traffic (then pays a slow cold-start on the next real request) — ping
    # it well under that window so it never sleeps.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping uroboros-backend /health
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$RENDER_BACKEND_URL" ]; then
            echo "::error::RENDER_BACKEND_URL secret is not set (repo Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

          target_url="${RENDER_BACKEND_URL%/}/health"
          echo "Pinging $target_url ..."
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$target_url" || echo "000")
          echo "Response: HTTP $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "::warning::uroboros-backend returned HTTP $status"
          fi
